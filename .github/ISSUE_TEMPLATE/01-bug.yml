name: 问题反馈
description: 报告功能异常、显示问题或操作不符合预期的情况。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进 alēthinósplan。请先搜索已有 Issue，避免重复提交。
        **Issue 是公开的。请勿提交密码、访问令牌、API 密钥、私人任务或未经打码的个人信息。**
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 请说明实际表现和你期望的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      placeholder: |
        1. 打开哪个页面
        2. 进行了什么操作
        3. 看到了什么结果
  - type: input
    id: environment
    attributes:
      label: 浏览器与设备
      placeholder: 例如 Chrome / Windows，或 Safari / iPhone；可补充版本号。
  - type: textarea
    id: screenshot
    attributes:
      label: 补充说明或截图（可选）
      description: 截图请先遮盖账号、邮箱及私人任务内容。
